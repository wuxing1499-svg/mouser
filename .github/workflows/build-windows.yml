# Build Mouser for Windows (x86_64).
# Source: plan/mouser 阶段 7 step 36
#
# Produces a portable zip artifact: Mouser-windows-x86_64.zip
#
# Note: v1 does NOT ship an MSI installer (would require WiX + EV cert).
# Users get a portable zip they extract and double-click Mouser.exe.

name: build-windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Do not let actions/checkout fetch submodules with --depth=1: the
          # pinned deskflow commit may not be a branch tip, so shallow fetch
          # fails with "not our ref". We fetch submodules separately below.
          submodules: false
          fetch-depth: 1

      - name: Fetch submodules (full)
        shell: pwsh
        run: |
          # Full clone (no --depth) so the pinned deskflow commit can be
          # checked out even if GitHub upload-pack rejects direct fetch.
          # `git submodule update --init` defaults to --depth=1 which fails
          # when the pinned commit is not a branch tip.
          git submodule sync --recursive
          git clone https://github.com/deskflow/deskflow.git vendor/deskflow
          # Extract pinned commit from `git submodule status` output:
          #   " e1e22c8916f59a158c818d88a2cfb00139e11573 vendor/deskflow (v1.26.0-2-ge1e22c891)"
          # NOTE: In pwsh, `(git ...)[0]` on a single-line string returns a
          # Char (not the line), so we use `Select-Object -First 1` instead.
          $statusLine = git submodule status vendor/deskflow | Select-Object -First 1
          Write-Host "Submodule status: $statusLine"
          $parts = $statusLine -split '\s+'
          $pinned = $parts[1]
          if (-not $pinned -or $pinned -notmatch '^[0-9a-f]{7,40}$') {
            Write-Error "Failed to extract pinned commit from: $statusLine"
            exit 1
          }
          Write-Host "Checking out deskflow @ $pinned"
          git -C vendor/deskflow checkout $pinned

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcore qtgui qtwidgets qtnetwork'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja & CMake
        uses: lukka/get-cmake@latest

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build C++ core + PyInstaller onedir
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: .\packaging\build.ps1 -QtPath $env:QT_ROOT_DIR

      - name: Compress-Archive (portable zip)
        run: |
          Compress-Archive -Path dist\Mouser\* -DestinationPath dist\Mouser-windows-x86_64.zip -Force
          Get-Item dist\Mouser-windows-x86_64.zip | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mouser-windows-x86_64
          path: dist/Mouser-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

