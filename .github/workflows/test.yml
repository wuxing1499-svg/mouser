# Python lint + unit tests for the Mouser GUI layer.
# Source: plan/mouser 阶段 7 step 37
#
# Runs on every push/PR (cheap, fast) — does NOT build the C++ core.
# Use build-macos.yml / build-windows.yml for full packaging.

name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # tests do not need vendor/deskflow
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check gui/ tests/

      - name: Ruff format check
        run: ruff format --check gui/ tests/

      - name: Pytest
        run: pytest tests/ -ra --strict-markers
